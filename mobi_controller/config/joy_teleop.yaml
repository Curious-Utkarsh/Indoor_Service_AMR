#Wired Joystick Config
joy_teleop:
  ros__parameters:
    move:
      type: topic
      interface_type: geometry_msgs/msg/Twist
      topic_name: input_joy/cmd_vel
      deadman_buttons: [7]  
      axis_mappings:
        twist-linear-x:   
          axis: 3   
          scale: 1.0
          offset: 0.0
        twist-angular-z: 
          axis: 0   
          scale: 1.0
          offset: 0.0


