name: robot-launcher
base: core22
version: '1.0'
summary: GUI for Robot Launcher
description: |
  A PyQt5-based dashboard to start/stop ROS2 robots and save maps.

grade: stable
confinement: classic

apps:
  robot-launcher:
    command: gui    # <= your console_script name
    plugs: [desktop, desktop-legacy, x11, home, network]

parts:
  gui-launcher:
    plugin: python         # <= python3 plugin
    source: .
    build-packages:
      - python3-dev
      - python3-venv
    python-packages:
      - PyQt5

  desktop-entries:
    plugin: dump
    source: snap/local
    stage:
      - robot-launcher.desktop
      - robot-launcher.png
    organize:
      robot-launcher.desktop: share/applications/robot-launcher.desktop
      robot-launcher.png:      share/icons/hicolor/128x128/apps/robot-launcher.png
